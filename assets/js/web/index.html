<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokedex</title>

    <style>
        h1 {
            color: red;
            text-align: center;
        }
        


    </style>
</head>
<body>
    <h1>Meu primeiro site</h1>
    <p>Meu primeiro saite om <b>javaScript</b> está sendo feito na <u><i>DIO!</i></u></p>

    <button id="btnTeste" type="button">
        Teste
    </button>

    <script>

        /* window é a nossa janela de alerta, confirmação, mensagens, etc.
        document é apigana html que estamos! 
        ex: */

        window.alert("Minha primeira mensagem!");

        const btnTeste = document.getElementById("btnTeste")
        btnTeste.addEventListener("click", function () {
            console.log('clickou no butão!')
        })

    </script>
